# Copy to <PokeSeller folder>/listing-rules.toml and adjust.
# The listing checker reads the nearest listing-rules.toml above a draft.
title_max = 80
no_japanese = true
price_must_be_empty = true
# Numbers of 7 to 10 digits look like grading cert numbers.
cert_number_pattern = '\b(cert(ification)?\s*(#|no\.?|number)?\s*:?\s*)?\d{7,10}\b'

[graded]
condition = "Good"
shipping_line = "Slab ships in a bubble mailer with protection."

[mercari]
# Name of the saved Mercari listing template to start from.
template_name = "Poke"
# Card-specific lines go above the template's standard text.
card_lines_above_template = true
