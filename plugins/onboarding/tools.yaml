# The software manifest (decision 11), approved 2026-11-06.
#
# Detection, installs, verification and the VM evidence all read this file
# through scripts/tools.py. Commands run in Windows PowerShell 5.1 on Windows
# and in sh on macOS and Linux. `{tmp}` is a fresh temp folder per check.
#
# Per tool:
#   id, name        stable key and display name
#   why             one plain sentence shown to the user before the install
#   when            always | subscription:<chatgpt|grok|gemini|any> | request
#   needs           ids that must be installed first
#   windows         winget: exact id, installed with -e --source winget and the
#                     agreement flags; scope: user | machine (machine installs go
#                     into the single elevated batch, one UAC prompt);
#                     override: installer args; script: non-winget install;
#                     post: commands after install
#   macos / linux   brew: formula or cask:<name>; apt: package; script: ...
#   check           detect: presence, exit 0 means present
#                   verify: used for real; must exit 0 and match `expect`
#                   Each is a command string, or a map with windows/macos/
#                   linux/default keys.
#   signin          the account this tool needs before verify can pass
#
# `{agents_vault}` in an expect pattern is BEEP_BEGINNERS_AGENTS_VAULT, default
# "Agents". Test runs point it at their own vault.
schema: beep-beginners/tools/v1
winget_success_codes: [0, 0x8A15002B, 0x8A150061, 0x8A15010D]

tools:
  - id: claude-desktop
    name: Claude desktop app
    why: "The app you use to talk to Claude and start work."
    when: always
    windows: { winget: Anthropic.Claude, scope: user }
    macos: { brew: "cask:claude" }
    check:
      detect:
        windows: "if (-not ((Test-Path \"$env:LOCALAPPDATA\\AnthropicClaude\\claude.exe\") -or (Get-AppxPackage *Claude*))) { exit 1 }"
        macos: "test -d /Applications/Claude.app"
      verify:
        windows: "$c = Get-Content \"$env:APPDATA\\Claude\\config.json\" -Raw | ConvertFrom-Json; [bool]($c.PSObject.Properties.Name -contains 'lastKnownAccountUuid')"
        macos: "test -f \"$HOME/Library/Application Support/Claude/config.json\" && echo True"
      expect: "True"
    signin: claude

  - id: git
    name: Git
    why: "Keeps a history of every change, so nothing is ever lost."
    when: always
    windows: { winget: Git.Git, scope: user }
    macos: { brew: git }
    linux: { apt: git }
    check:
      detect: "git --version"
      verify: "git init -q {tmp}/g; git -C {tmp}/g -c user.name=probe -c user.email=probe@localhost commit -q --allow-empty -m probe; git -C {tmp}/g log --oneline"
      expect: "probe"

  - id: claude-code
    name: Claude Code
    why: "Lets Claude run the setup steps and the helpers that keep your work safe."
    when: always
    needs: [git]
    windows: { script: "irm https://claude.ai/install.ps1 | iex", scope: user }
    macos: { script: "curl -fsSL https://claude.ai/install.sh | bash" }
    linux: { script: "curl -fsSL https://claude.ai/install.sh | bash" }
    check:
      detect: "claude --version"
      verify: "claude auth status"
      expect: "\"loggedIn\": true"
    signin: claude

  - id: chrome
    name: Google Chrome
    why: "Claude uses Chrome to do the website steps for you."
    when: always
    windows: { winget: Google.Chrome.EXE, scope: user }
    macos: { brew: "cask:google-chrome" }
    linux: { script: "see https://www.google.com/chrome/" }
    check:
      detect:
        windows: "if (-not ((Test-Path \"$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe\") -or (Test-Path \"$env:LOCALAPPDATA\\Google\\Chrome\\Application\\chrome.exe\"))) { exit 1 }"
        macos: "test -d '/Applications/Google Chrome.app'"
        linux: "command -v google-chrome"
      verify:
        windows: "$p = @(\"$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe\",\"$env:LOCALAPPDATA\\Google\\Chrome\\Application\\chrome.exe\") | ? { Test-Path $_ } | Select -First 1; (Get-Item $p).VersionInfo.ProductVersion"
        macos: "'/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version"
        linux: "google-chrome --version"
      expect: "\\d+\\.\\d+\\."

  - id: gh
    name: GitHub CLI
    why: "Lets Claude save your work to your private GitHub account."
    when: always
    windows: { winget: GitHub.cli, scope: user, installer_type: portable }
    macos: { brew: gh }
    linux: { apt: gh }
    check:
      detect: "gh --version"
      verify: "gh api user --jq .login"
      expect: "\\w"
    signin: github

  - id: uv
    name: uv
    why: "Runs the small Python helpers that keep the workspace tidy."
    when: always
    windows: { script: "irm https://astral.sh/uv/install.ps1 | iex", scope: user }
    macos: { brew: uv }
    linux: { script: "curl -LsSf https://astral.sh/uv/install.sh | sh" }
    check:
      detect: "uv --version"
      verify: "uv run --no-project --python 3.13 python -c \"print('uv-ok')\""
      expect: "uv-ok"

  - id: python
    name: Python 3.13
    why: "A programming language. The helper scripts and many data projects use it."
    when: always
    needs: [uv]
    windows: { script: "uv python install 3.13 --default", scope: user }
    macos: { script: "uv python install 3.13 --default" }
    linux: { script: "uv python install 3.13 --default" }
    check:
      detect: "uv python find 3.13"
      verify: "uv run --no-project --python 3.13 python -c \"import sys; print('py', sys.version_info[0], sys.version_info[1])\""
      expect: "py 3 13"

  - id: onepassword
    name: 1Password
    why: "Keeps your passwords safe and lets Claude use a secret without ever seeing it."
    when: always
    windows: { winget: AgileBits.1Password, scope: user }
    macos: { brew: "cask:1password" }
    check:
      detect:
        windows: "if (-not ((Get-AppxPackage *1Password*) -or (Test-Path \"$env:LOCALAPPDATA\\1Password\\app\"))) { exit 1 }"
        macos: "test -d /Applications/1Password.app"
      verify: "op whoami"
      expect: "URL"
    signin: onepassword

  - id: op
    name: 1Password CLI
    why: "The part of 1Password that Claude's helpers talk to."
    when: always
    needs: [onepassword]
    windows: { winget: AgileBits.1Password.CLI, scope: user }
    macos: { brew: "cask:1password-cli" }
    check:
      detect: "op --version"
      verify: "op vault list"
      expect: "{agents_vault}"
    signin: onepassword

  - id: node
    name: Node.js (through fnm)
    why: "Some Claude add-ons need Node to run."
    when: always
    windows: { winget: Schniz.fnm, scope: user, post: "fnm install --lts; fnm default lts-latest" }
    macos: { brew: fnm, post: "fnm install --lts" }
    linux: { script: "curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell && fnm install --lts" }
    check:
      detect: "fnm --version"
      verify: "fnm exec --using=default node -e \"console.log('node-ok')\""
      expect: "node-ok"

  - id: bun
    name: Bun
    why: "A fast tool for TypeScript projects. Nothing here depends on it."
    when: always
    windows: { winget: Oven-sh.Bun, scope: user }
    macos: { brew: bun }
    linux: { script: "curl -fsSL https://bun.sh/install | bash" }
    check:
      detect: "bun --version"
      verify: "bun -e \"console.log('bun-ok')\""
      expect: "bun-ok"

  - id: vcredist
    name: Microsoft Visual C++ runtime
    why: "A Windows library several of these tools need. It goes in with the one permission prompt."
    when: always
    windows: { winget: Microsoft.VCRedist.2015+.x64, scope: machine }
    check:
      detect:
        windows: "if (-not (Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\x64' -ErrorAction SilentlyContinue).Installed) { exit 1 }"
        default: "true"
      verify:
        windows: "(Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\x64').Version"
        default: "echo v14"
      expect: "v?14"

  - id: vs-build-tools
    name: Visual Studio Build Tools (C++)
    why: "Rust needs these to build programs on Windows. It's a big download, a few GB."
    when: always
    windows:
      winget: Microsoft.VisualStudio.BuildTools
      scope: machine
      override: "--wait --quiet --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
    check:
      detect:
        windows: "$w = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"; if (-not (Test-Path $w)) { exit 1 }; $p = & $w -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath; if (-not $p) { exit 1 }"
        default: "true"
      verify:
        windows: "& \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath"
        default: "echo not-needed"
      expect: "\\S"

  - id: rust
    name: Rust
    why: "Builds some tools from source."
    when: always
    needs: [vs-build-tools]
    windows: { winget: Rustlang.Rustup, scope: user, post: "rustup default stable" }
    macos: { brew: rustup, post: "rustup default stable" }
    linux: { script: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y" }
    check:
      detect: "cargo --version"
      verify: "cargo new -q {tmp}/hello; cargo run -q --manifest-path {tmp}/hello/Cargo.toml"
      expect: "Hello, world!"

  - id: tailscale
    name: Tailscale
    why: "A private link so your helper can fix things when you ask them to."
    when: always
    windows: { winget: Tailscale.Tailscale, scope: machine }
    macos: { brew: "cask:tailscale-app" }
    linux: { script: "curl -fsSL https://tailscale.com/install.sh | sh" }
    check:
      detect:
        windows: "if (-not (Test-Path \"$env:ProgramFiles\\Tailscale\\tailscale.exe\")) { exit 1 }"
        default: "tailscale version"
      verify:
        windows: "& \"$env:ProgramFiles\\Tailscale\\tailscale.exe\" status --json | ConvertFrom-Json | % BackendState"
        default: "tailscale status --json | grep -o '\"BackendState\": *\"[A-Za-z]*\"'"
      expect: "Running"
    signin: tailscale

  - id: openssh-server
    name: Windows OpenSSH Server
    why: "Lets your helper run fixes on your PC over Tailscale, and only when you ask."
    when: always
    windows: { script: "elevated:openssh", scope: machine }
    check:
      detect:
        windows: "if ((Get-WindowsCapability -Online -Name OpenSSH.Server*).State -ne 'Installed') { exit 1 }"
        default: "true"
      verify:
        windows: "$s = Get-Service sshd; $r = Get-NetFirewallRule -Name beep-beginners-ssh-tailscale -ErrorAction SilentlyContinue; \"sshd=$($s.Status) rule=$([bool]$r)\""
        default: "echo sshd=Running rule=True"
      expect: "sshd=Running rule=True"

  - id: openknowledge
    name: OpenKnowledge
    why: "An app for reading and editing your notes and plans."
    when: always
    windows: { script: "github-release:inkeep/open-knowledge:OpenKnowledge-Setup-x64.exe", scope: user }
    check:
      detect:
        windows: "if (-not (Get-ChildItem \"$env:LOCALAPPDATA\\Programs\" -Filter 'OpenKnowledge*' -Directory -ErrorAction SilentlyContinue)) { exit 1 }"
        default: "true"
      verify:
        windows: "Get-ChildItem \"$env:LOCALAPPDATA\\Programs\" -Recurse -Depth 2 -Filter 'OpenKnowledge.exe' -ErrorAction SilentlyContinue | Select -First 1 | % { $_.VersionInfo.ProductVersion }"
        default: "echo 0.0.0"
      expect: "\\d+\\.\\d+"

  - id: windows-terminal
    name: Windows Terminal
    why: "Comes with Windows 11. Checked, and installed only if it's missing."
    when: always
    windows: { winget: Microsoft.WindowsTerminal, scope: user }
    check:
      detect:
        windows: "if (-not (Get-AppxPackage Microsoft.WindowsTerminal)) { exit 1 }"
        default: "true"
      verify:
        windows: "(Get-AppxPackage Microsoft.WindowsTerminal).Version"
        default: "echo 1.0"
      expect: "^\\d+\\."

  - id: pwsh
    name: PowerShell 7
    why: "A newer Windows command shell that some tools prefer."
    when: always
    windows: { winget: Microsoft.PowerShell, scope: machine }
    macos: { brew: powershell }
    check:
      detect: "pwsh --version"
      verify: "pwsh -NoProfile -Command \"'pwsh-' + $PSVersionTable.PSVersion.Major\""
      expect: "pwsh-7"

  - id: vscode
    name: VS Code
    why: "A code editor that also opens notebooks."
    when: always
    windows: { winget: Microsoft.VisualStudioCode, scope: user }
    macos: { brew: "cask:visual-studio-code" }
    check:
      detect: "code --version"
      verify: "code --version"
      expect: "^\\d+\\.\\d+"

  # From the subscriptions question (decision 21).
  - id: chatgpt-codex
    name: ChatGPT and Codex
    why: "You pay for ChatGPT, so Claude can hand some work to Codex and save your Claude limits."
    when: subscription:chatgpt
    windows: { winget: OpenAI.Codex, scope: user, also: [OpenAI.ChatGPT] }
    macos: { brew: "cask:codex", also: ["cask:chatgpt"] }
    check:
      detect: "codex --version"
      verify: "codex login status"
      expect: "Logged in"
    signin: chatgpt

  - id: grok
    name: Grok CLI
    why: "You pay for Grok, so Claude can use it for web research."
    when: subscription:grok
    windows: { winget: xAI.GrokBuild, scope: user }
    macos: { brew: "cask:grok-build" }
    check:
      detect: "grok --version"
      verify: "grok --version"
      expect: "\\d"
    signin: grok

  - id: gemini
    name: Gemini CLI
    why: "You pay for Gemini, so Claude can hand some work to it."
    when: subscription:gemini
    needs: [node]
    windows: { script: "fnm exec --using=default npm install -g @google/gemini-cli", scope: user }
    macos: { brew: gemini-cli }
    check:
      detect: "gemini --version"
      verify: "gemini --version"
      expect: "\\d"
    signin: gemini

  - id: cliproxyapi
    name: CLIProxyAPI
    why: "Runs in the background so Claude's helpers can use your other AI subscription."
    when: subscription:any
    windows: { winget: LuisPater.CLIProxyAPI, scope: user, post: "logon-task:cliproxyapi" }
    macos: { brew: cliproxyapi }
    check:
      detect:
        windows: "if (-not (Get-Command cli-proxy-api -ErrorAction SilentlyContinue)) { exit 1 }"
        default: "command -v cli-proxy-api"
      verify:
        windows: "(Get-ScheduledTask -TaskName beep-beginners-cliproxyapi -ErrorAction SilentlyContinue).State"
        default: "echo Ready"
      expect: "Ready|Running"

  - id: obsidian
    name: Obsidian
    why: "Another notes app, installed because you asked for it."
    when: request
    windows: { winget: Obsidian.Obsidian, scope: user }
    macos: { brew: "cask:obsidian" }
    check:
      detect:
        windows: "if (-not (Test-Path \"$env:LOCALAPPDATA\\Programs\\Obsidian\\Obsidian.exe\")) { exit 1 }"
        default: "test -d /Applications/Obsidian.app"
      verify:
        windows: "(Get-Item \"$env:LOCALAPPDATA\\Programs\\Obsidian\\Obsidian.exe\").VersionInfo.ProductVersion"
        default: "echo 1.0"
      expect: "\\d+\\.\\d+"
