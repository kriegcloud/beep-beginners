# Seed for one person's workspace. Onboarding applies it only after the user
# confirms it's them. No names of the user, places, money amounts, account
# ids or buyer data belong in here: the kit is public.
id = "milkman"
description = "Card reseller learning Python, SQL and Power BI for an analyst job."

[helper]
name = "Benjamin"
# Public SSH keys only. GitHub serves them at this address.
keys_url = "https://github.com/kriegcloud.keys"

[plugins]
# Turned on in the workspace on top of the template's defaults.
enable = ["pokeseller@beep-beginners", "job-hunt@beep-beginners"]

[repos]
# A second private repo made next to the workspace, from seeds/milkman/pokeledger.
pokeledger = { name = "PokeLedger", mode = "mentor" }

[paths]
# workspace.config defaults. {documents} and {home} resolve on the machine.
pokeseller_data = "{documents}/PokeSeller"
card_inbox_ready = "{home}/CardInbox/Ready"
resumes_out = "{documents}/Cover Letters/Claude Resumes"
job_tracker = "{documents}/Cover Letters/Claude Resumes/job_tracker.csv"
base_resume = ""
pokeledger_data = "{documents}/PokeLedger/Data"
pokeledger_powerbi = "{documents}/PokeLedger/Powerbi"

[move_code]
# Code that moves from Documents into git, with the user's OK (decision 5).
# Workbooks, raw data and Power BI files stay in Documents.
pokeseller = { from = "{documents}/PokeSeller", into = "PokeSeller", patterns = ["*.py", "config.json"] }
pokeledger = { from = "{documents}/PokeLedger", into = "", patterns = ["Notebooks/**/*.ipynb", "SQL/**/*.sql", "*.py"] }
